# Weekly: update flake.lock, build everything with the new inputs, and open (or refresh) a PR
# that says whether the build passed. PRs opened by GITHUB_TOKEN don't trigger other
# workflows, so the check runs here, before the PR is created.
name: Update flake.lock

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: nix flake update
        run: nix flake update 2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: nix flake check
        id: check
        continue-on-error: true
        run: nix flake check --print-build-logs

      - name: Write PR body
        run: |
          {
            if [ "${{ steps.check.outcome }}" = success ]; then
              echo "✅ \`nix flake check\` passed with the new inputs: safe to merge and \`rebuild\`."
            else
              echo "❌ \`nix flake check\` failed with the new inputs. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the error before merging."
            fi
            echo
            echo '```'
            grep -E "^(•|  )" "$RUNNER_TEMP/update.log" || cat "$RUNNER_TEMP/update.log"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update-flake-lock
          delete-branch: true
          commit-message: Update flake.lock
          title: ${{ steps.check.outcome == 'success' && 'Update flake.lock' || 'Update flake.lock (build failing)' }}
          body-path: ${{ runner.temp }}/body.md
