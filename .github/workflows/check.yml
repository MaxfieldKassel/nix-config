# Builds every machine for macOS and checks formatting (`nix flake check`) on each push and PR.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: nix flake check
        run: nix flake check --print-build-logs
